name: Rust and native macOS bridge
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-14, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets --features macos-api-check
      - run: cargo clippy --locked --all-targets --features macos-api-check -- -D warnings
      - if: runner.os == 'macOS'
        run: cargo build --locked --release
      - if: runner.os == 'macOS'
        run: cargo run --locked --example macos_native_check
